# Render Blueprint for the FRONTEND (separate from backend/render.yaml)
# On Render: New -> Blueprint -> connect your debtrix-frontend repo
# Render reads this file and creates the web service automatically.

services:
  - type: web
    name: debtrix-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npx next start -p $PORT"
    envVars:
      - key: NODE_VERSION
        value: "20.17.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false   # set this to your backend URL, e.g. https://debtrix-api.onrender.com
